  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  color-scheme:light only
}

html{
  color-scheme:light only;
  background:#FFF8F0 !important
}

body{
  background:#FFF8F0 !important;
  color:#1A1A2E !important
}

:root{
  --paper:#FFF8F0;
  --paper2:#FFEEE6;
  --sakura:#FF8FAB;
  --sakura-deep:#E85D8A;
  --sakura-soft:#FFE3EC;
  --indigo:#2B2D5C;
  --indigo2:#4A4E8A;
  --ink:#1A1A2E;
  --muted:#666666;
  --line:#E6DDD8;
  --surface:#FFFFFF;
  --surface2:#FFFDFB;
  --green:#2E9E6B;
  --amber:#E8A33D;
  --red:#D95D6B;
  --green-strong:#22A06B;
  --green-dark:#0F6B44;
  --green-light:#DFF5E6;
  --kana:#C2185B;
  --example:#333333;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--paper);
  color:#1A1A2E;
  font-family:"PingFang TC","PingFang SC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.jp{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","PingFang TC",sans-serif
}

.serif{
  font-family:"Songti TC","PMingLiU","Noto Serif TC",serif
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.card{
  box-shadow:0 8px 24px rgba(43,45,92,.07);
  background:#FFFFFF;
  color:#1A1A2E
}

.vocab-card{
  position:relative;
  overflow:hidden;
  background:#FFFFFF !important;
  color:#1A1A2E;
  border-radius:20px;
  padding:20px;
  line-height:1.7
}

.vocab-card .vocab-jp{
  color:#1A1A2E !important
}

.mastered-badge{
  background:#DFF5E6 !important;
  color:#0F6B44 !important
}

.green-solid-btn{
  background:#22A06B !important;
  color:#FFFFFF !important;
  font-weight:700;
  font-size:16px;
  padding:12px 18px
}

.flip{
  perspective:900px
}

.flip-inner{
  transition:transform .45s;
  transform-style:preserve-3d;
  position:relative
}

.flip.flipped .flip-inner{
  transform:rotateY(180deg)
}

.flip-face{
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden
}

.flip-back{
  transform:rotateY(180deg)
}

/* Force light mode: never let iOS / system dark mode recolour the page. */

@media (prefers-color-scheme: dark){
  :root, html, body{
    color-scheme:light only !important;
    background:#FFF8F0 !important;
    color:#1A1A2E !important
  }

  .card, .vocab-card, .grammar-card, .kanji-card, .counter-card, .verb-card, .header, .tab-content, .nav, .bottom-nav{
    background:#FFFFFF !important;
    color:#1A1A2E !important;
    border-color:#E8E0D8 !important
  }

  .meaning-box, .example-box{
    background:#F3F0FF !important;
    color:#1A1A2E !important
  }

  .japanese-word{
    color:#1A1A2E !important
  }

  .kana{
    color:#C2185B !important
  }

  .btn-primary{
    background:#22A06B !important;
    color:#FFFFFF !important
  }

  .badge-learned{
    background:#DFF5E6 !important;
    color:#0F6B44 !important
  }

  input, textarea, select{
    background:#FFFFFF !important;
    color:#1A1A2E !important
  }
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

係比較基準。",exJP:"電車より バスのほうが 安いです。",exZH:"巴士比電車便宜。",q:"「私より 弟のほうが 背が 高いです。」意思？",a:"弟弟比我高。"},{title:"〜ましょう — 一起吧",formula:"ます形去ます + ましょう",yue:"提議一齊做，語氣溫和。",exJP:"一緒に 映画を 見ましょう。",exZH:"一起去看電影吧。",q:"「一緒に 食べ＿＿。」填？",a:"ましょう — 食べましょう。"},{title:"〜たり〜たり — 有時…有時…",formula:"た形 + り、た形 + りする",yue:"列舉代表性例子，唔係全部。",exJP:"日曜日は 本を 読んだり 映画を 見たりします。",exZH:"星期日有時看書，有時看電影。",q:"「歌を 歌ったり 踊ったり＿＿。」填？",a:"します — たりたりする作結尾。"},{title:"〜ながら — 一邊…一邊…",formula:"ます形去ます + ながら",yue:"同時做兩件事，主動作喺後面。",exJP:"音楽を 聞きながら 勉強します。",exZH:"一邊聽音樂一邊學習。",q:"「歩き＿＿ 話します。」填？",a:"ながら — 歩きながら。"},{title:"〜つもり — 打算",formula:"辞書形 / ない形 + つもりです",yue:"講自己計劃/打算，語氣肯定。",exJP:"明日 東京へ 行くつもりです。",exZH:"打算明天去東京。",q:"「日本語を 勉強する＿＿です。」填？",a:"つもり — 勉強するつもりです。"},{title:"〜かもしれません — 可能",formula:"普通形 + かもしれません",yue:"推測，可能性唔高但有可能。",exJP:"明日は 雨が 降るかもしれません。",exZH:"明天可能會下雨。",q:"「彼は 来ない＿＿。」填？",a:"かもしれません。"},{title:"〜と思います — 我覺得",formula:"普通形 + と思います",yue:"講自己意見，唔好用嚟講人哋諗法。",exJP:"この本は 面白いと 思います。",exZH:"我覺得這本書很有趣。",q:"「明日は 晴れる＿＿。」填？",a:"と思います。"},{title:"〜てしまいます — 不小心… / 做完",formula:"て形 + しまいます",yue:"唔小心做咗、或者徹底做完，帶少少後悔/完成感。",exJP:"鍵を なくしてしまいました。",exZH:"不小心弄丟了鑰匙。",q:"「宿題を 忘れて＿＿。」填？",a:"しまいました。"},{title:"〜ておきます — 預先做好",formula:"て形 + おきます",yue:"為咗將來預先準備好。",exJP:"旅行の前に 切符を 買っておきます。",exZH:"旅行前預先買好票。",q:"「部屋を 掃除して＿＿。」填？",a:"おきます — 掃除しておきます。"},{title:"〜てあげます / くれます / もらいます",formula:"て形 + あげます・くれます・もらいます",yue:"あげます：我幫人；くれます：人幫我；もらいます：我收到人幫忙。",exJP:"友達に 本を 貸してあげました。",exZH:"借了書給朋友。",q:"「先生が 私に 教えて＿＿。」填？",a:"くれました — 先生幫我。"},{title:"〜すぎます — 太…",formula:"ます形去ます / い形容詞去い + すぎます",yue:"超過適當程度。",exJP:"食べすぎました。",exZH:"吃太多了。",q:"「この荷物は 重＿＿。」填？",a:"すぎます — 重すぎます。"},{title:"〜ことができます — 能夠…",formula:"辞書形 + ことができます",yue:"講能力/可能，唔使變可能形都得。",exJP:"日本語を 話すことが できます。",exZH:"會說日語。",q:"「泳ぐことが ＿＿。」填？",a:"できます。"},{title:"〜なければなりません — 必須…",formula:"ない形去ない + ければなりません",yue:"唔做唔得，正式義務。口語：なきゃ。",exJP:"宿題を しなければなりません。",exZH:"必須做功課。",q:"「早く 行か＿＿なりません。」填？",a:"なければ — 行かなければなりません。"},{title:"〜ても — 即使…也…",formula:"て形 + も",yue:"讓步：就算…都…",exJP:"雨が 降っても 行きます。",exZH:"即使下雨也要去。",q:"「忙しくて＿＿ 行きます。」填？",a:"も — 忙しくても。"},{title:"〜ばかり — 剛剛…",formula:"た形 + ばかりです",yue:"啱啱做完，時間好近。",exJP:"今 起きたばかりです。",exZH:"剛剛才起床。",q:"「ご飯を 食べた＿＿です。」填？",a:"ばかり — 食べたばかりです。"},{title:"〜たことがあります — 曾經…",formula:"た形 + ことがあります",yue:"講經驗：曾經做過。",exJP:"日本へ 行ったことが あります。",exZH:"曾經去過日本。",q:"「寿司を 食べたことが ＿＿。」填？",a:"あります。"},{title:"〜ほうがいい — 最好…",formula:"た形 / ない形 + ほうがいい",yue:"提建議：做咗好啲 / 唔做好啲。",exJP:"早く 寝たほうがいいです。",exZH:"最好早點睡。",q:"「薬を 飲んだ＿＿です。」填？",a:"ほうがいい。"},,{title:"〜は〜じゃありません — 不是…",formula:"名詞 + は + 名詞 + じゃありません",cat:"表達",yue:"否定句：唔係…。丁寧形係 ではありません，口語用 じゃありません。",exJP:"私は 学生じゃありません。先生です。",exZH:"我不是學生。是老師。",exJP2:"これは 本じゃありません。ノートです。",exZH2:"這不是書。是筆記本。",q:"「私は 先生＿＿。」否定填？",a:"じゃありません — 先生じゃありません。"},{title:"〜がいます / あります — 有…",formula:"場所 + に + 人/動物 + がいます ／ 物 + があります",cat:"助詞",yue:"有生命用います，無生命用あります。位置用 に。",exJP:"公園に 子どもが います。机の上に 本が あります。",exZH:"公園裡有孩子。桌子上有書。",exJP2:"家に 猫が います。",exZH2:"家裡有貓。",q:"「公園に 犬＿＿ います。」填？",a:"が — 犬がいます。"},{title:"〜が好き / 嫌い / 上手 / 下手 — 喜歡 / 討厭 / 擅長 / 不擅長",formula:"人 + は + 物 + が + 好き / 嫌い / 上手 / 下手です",cat:"表達",yue:"講喜好同能力，前面用 が。好き嘅反義係 嫌い。",exJP:"私は 映画が 好きです。弟は 野菜が 嫌いです。",exZH:"我喜歡電影。弟弟討厭蔬菜。",exJP2:"私は テニスが 上手です。歌が 下手です。",exZH2:"我網球打得很好。唱歌不好。",q:"「私は 音楽＿＿ 好きです。」填？",a:"が — 音楽が好きです。"},{title:"〜がほしい — 想要（東西）",formula:"人 + は + 物 + が + ほしいです",cat:"表達",yue:"想要一件物件用 ほしい，想要做嘢用 〜たい。唔好直接講人哋 ほしい。",exJP:"新しい パソコンが ほしいです。",exZH:"想要一台新電腦。",exJP2:"プレゼントが ほしいです。",exZH2:"想要禮物。",q:"「新しい 本＿＿ ほしいです。」填？",a:"が — 本がほしいです。"},{title:"〜ができます — 能夠…",formula:"辞書形 + ことができます ／ 物 + ができます",cat:"動詞變化",yue:"講能力：可以做某件事，或者某樣嘢完成/做好。",exJP:"日本語を 話すことが できます。",exZH:"會說日語。",exJP2:"新しい 学校が できました。",exZH2:"新學校建成了。",q:"「泳ぐことが ＿＿。」填？",a:"できます。"},{title:"〜をください — 請給我…",formula:"物 + を + ください",cat:"表達",yue:"買嘢、點餐、請求對方畀某樣嘢，用 をください。",exJP:"水を ください。",exZH:"請給我水。",exJP2:"切符を ください。",exZH2:"請給我票。",q:"「コーヒー＿＿ ください。」填？",a:"を — コーヒーをください。"},{title:"〜をくださいませんか — 可以請你給我…嗎？",formula:"物 + を + くださいませんか",cat:"表達",yue:"比 ください 更客氣嘅請求，買嘢、問路都啱。",exJP:"写真を 撮ってくださいませんか。",exZH:"可以請你幫我拍照嗎？",exJP2:"水を くださいませんか。",exZH2:"可以請你給我水嗎？",q:"「ペンを 貸して＿＿ませんか。」填？",a:"ください — 貸してくださいませんか。"},{title:"〜てはいけません — 不可以…",formula:"て形 + はいけません",cat:"動詞變化",yue:"禁止：唔可以做。反義係 〜てもいいです。",exJP:"ここで 写真を 撮ってはいけません。",exZH:"不可以在這裡拍照。",exJP2:"ここに 入ってはいけません。",exZH2:"不可以進這裡。",q:"「ここで 騒いで＿＿いけません。」填？",a:"は — 騒いではいけません。"},{title:"〜なくてもいいです — 不用…也可以",formula:"ない形去ない + なくてもいいです",cat:"動詞變化",yue:"唔需要做都得。同 〜なければなりません 相反。",exJP:"今日は 来なくてもいいです。",exZH:"今天不來也可以。",exJP2:"宿題を しなくてもいいです。",exZH2:"功課不做也可以。",q:"「明日は 来＿＿てもいいです。」填？",a:"なく — 来なくてもいいです。"},{title:"〜し〜し — 又…又…",formula:"普通形 + し、普通形 + し",cat:"表達",yue:"列舉多個原因/理由，語氣似「又…又…」。",exJP:"安いし、おいしいし、この店が 好きです。",exZH:"又便宜又好吃，喜歡這間店。",exJP2:"忙しいし、疲れたし、早く 寝ます。",exZH2:"又忙又累，早點睡。",q:"「安い＿＿、近い＿＿、ここが 好きです。」填？",a:"し、し — 安いし、近いし。"},{title:"〜まえに / 〜あとで — 之前 / 之後",formula:"辞書形 + まえに ／ て形 + あとで",cat:"動詞變化",yue:"まえに用辞書形，あとで用て形，唔好調轉。",exJP:"食べるまえに 手を 洗います。食べてあとで 歯を 磨きます。",exZH:"吃飯前洗手。吃完後刷牙。",exJP2:"寝るまえに 本を 読みます。",exZH2:"睡覺前看書。",q:"「食べる＿＿ 手を 洗います。」填？",a:"まえに — 食べるまえに。"},{title:"〜とき — …的時候",formula:"辞書形 / た形 / ない形 + とき",cat:"動詞變化",yue:"講某個時間點做咗咩。過去用た形，未來/習慣用辞書形。",exJP:"日本へ 行ったとき、桜を 見ました。",exZH:"去日本的時候，看見了櫻花。",exJP2:"子どものとき、よく 遊びました。",exZH2:"小時候，經常玩。",q:"「暇な＿＿、映画を 見ます。」填？",a:"とき — 暇なとき。"},{title:"〜でしょう / 〜だろう — 大概吧",formula:"普通形 + でしょう ／ だろう",cat:"表達",yue:"推測、禮貌確認。でしょう較禮貌，だろう較隨意。",exJP:"明日は 晴れるでしょう。",exZH:"明天大概會晴天吧。",exJP2:"彼は 来るでしょう。",exZH2:"他大概會來吧。",q:"「明日は 雨が 降る＿＿。」填？",a:"でしょう。"},{title:"〜と言います — 叫做… / 說…",formula:"名前 + と言います ／ 普通形 + と言います",cat:"表達",yue:"自我介紹講名，或者引述人哋講過嘅嘢。",exJP:"私は 田中と 言います。",exZH:"我叫田中。",exJP2:"先生は「明日は 休みです」と 言いました。",exZH2:"老師說「明天休息」。",q:"「私は 佐藤＿＿ 言います。」填？",a:"と — 佐藤と言います。"},{title:"〜は〜より〜です — 比…更…",formula:"A + は + B + より + 形容詞です",cat:"比較",yue:"A比B更…，より前面係比較對象。",exJP:"東京は 大阪より 大きいです。",exZH:"東京比大阪大。",exJP2:"電車は バスより 早いです。",exZH2:"電車比巴士快。",q:"「私は 弟＿＿ 背が 高いです。」填？",a:"より — 弟より。"},{title:"〜は一番〜です — 是最…的",formula:"範圍 + で + 一番 + 形容詞です",cat:"比較",yue:"喺某個範圍入面最…，一番唔使加 より。",exJP:"日本で 一番 高い 山は 富士山です。",exZH:"日本最高的山是富士山。",exJP2:"クラスで 一番 早いです。",exZH2:"是班上最快的。",q:"「クラスで 一番 ＿＿です。」填形容詞？",a:"早い / 高い 等 — 一番 + 形容詞。"},{title:"〜の方が〜です — …那邊更…",formula:"A + のほうが + 形容詞です",cat:"比較",yue:"比較兩者，強調嗰邊更…。",exJP:"バスのほうが 電車より 安いです。",exZH:"巴士比電車便宜。",exJP2:"今日のほうが 暑いです。",exZH2:"今天更熱。",q:"「電車＿＿ほうが 早いです。」填？",a:"の — 電車のほうが。"},{title:"〜より〜の方が — 比…，…更…",formula:"A + より + B + のほうが + 形容詞です",cat:"比較",yue:"完整比較句：AよりBのほうが…。",exJP:"バスより 電車のほうが 早いです。",exZH:"電車比巴士快。",exJP2:"冬より 夏のほうが 暑いです。",exZH2:"夏天比冬天熱。",q:"「私＿＿ 弟のほうが 背が 高いです。」填？",a:"より — 私より。"},{title:"〜は〜ほど〜くありません — 沒有…那麼…",formula:"A + は + B + ほど + 形容詞くないです",cat:"比較",yue:"否定比較：A冇B咁…。留意形容詞要變否定。",exJP:"大阪は 東京ほど 大きくありません。",exZH:"大阪沒有東京那麼大。",exJP2:"今日は 昨日ほど 暑くありません。",exZH2:"今天沒有昨天那麼熱。",q:"「バスは 電車ほど 早＿＿ありません。」填？",a:"く — 早くありません。"},{title:"〜でも〜でも — 不論…還是…",formula:"名詞 + でも + 名詞 + でも",cat:"表達",yue:"邊個都得，任揀。",exJP:"コーヒーでも お茶でも いいです。",exZH:"咖啡或者茶都可以。",exJP2:"土曜日でも 日曜日でも いいです。",exZH2:"星期六或者星期日都可以。",q:"「いつ＿＿ いいです。」填？",a:"でも — いつでもいいです。"},{title:"〜か〜か — 是…還是…",formula:"名詞 + か + 名詞 + か",cat:"表達",yue:"二選一疑問：係A定係B？",exJP:"コーヒーか お茶か、どちらが いいですか。",exZH:"咖啡還是茶，哪個好？",exJP2:"土曜日か 日曜日か、どちらが いいですか。",exZH2:"星期六還是星期日，哪個好？",q:"「猫＿＿ 犬＿＿、どちらが 好きですか。」填？",a:"か、か — 猫か犬か。"},{title:"〜や〜など — …等等",formula:"名詞 + や + 名詞 + など",cat:"助詞",yue:"列舉例子，唔係全部。など係「等等」。",exJP:"机の上に 本や ノートなどが あります。",exZH:"桌子上有書、筆記本等等。",exJP2:"果物や 野菜を 買います。",exZH2:"買水果、蔬菜等等。",q:"「パン＿＿ ケーキ＿＿ 買います。」填？",a:"や、など — パンやケーキなど。"},{title:"〜と〜とどちらが — …和…哪個更…",formula:"A + と + B + と + どちらが + 形容詞ですか",cat:"比較",yue:"問兩者比較，答：Aのほうが…です。",exJP:"バスと 電車と どちらが 早いですか。",exZH:"巴士和電車哪個更快？",exJP2:"猫と 犬と どちらが 好きですか。",exZH2:"貓和狗哪個更喜歡？",q:"「夏＿＿ 冬＿＿ どちらが 暑いですか。」填？",a:"と、と — 夏と冬と。"},{title:"〜にします — 就選…",formula:"名詞 + にします",cat:"表達",yue:"點餐、做決定：就揀呢個。",exJP:"私は コーヒーにします。",exZH:"我選咖啡。",exJP2:"赤いのにします。",exZH2:"選紅色的。",q:"「私は ケーキ＿＿します。」填？",a:"に — ケーキにします。"},{title:"〜に行きました — 去…做…（目的）",formula:"辞書形 + に + 行きます / 来ます / 帰ります",cat:"動詞變化",yue:"去做某件事，動詞用辞書形 + に。",exJP:"買い物に 行きました。",exZH:"去買東西了。",exJP2:"映画を 見に 行きます。",exZH2:"去看電影。",q:"「本を 買い＿＿ 行きます。」填？",a:"に — 買いに。"},{title:"〜てみます — 試試…",formula:"て形 + みます",cat:"動詞變化",yue:"試下做，唔係「睇」。",exJP:"食べてみます。",exZH:"試吃一下。",exJP2:"日本語で 話してみます。",exZH2:"試著用日語說。",q:"「着て＿＿。」填？",a:"みます — 着てみます。"},{title:"〜てから — …之後",formula:"て形 + から",cat:"動詞變化",yue:"做完某件事之後先做下一件。",exJP:"食べてから 寝ます。",exZH:"吃完再睡。",exJP2:"宿題をしてから 遊びます。",exZH2:"做完功課再玩。",q:"「起きて＿＿ 顔を 洗います。」填？",a:"から — 起きてから。"},{title:"〜てすみません — 不好意思，做了…",formula:"て形 + すみません",cat:"表達",yue:"為自己做咗嘅事道歉。",exJP:"遅れて すみません。",exZH:"不好意思，遲到了。",exJP2:"忘れて すみません。",exZH2:"不好意思，忘記了。",q:"「騒いで ＿＿。」填？",a:"すみません — 騒いですみません。"},{title:"〜てくれてありがとう — 謝謝你幫我…",formula:"て形 + くれてありがとう",cat:"表達",yue:"多謝對方幫手做咗某件事。",exJP:"教えてくれて ありがとう。",exZH:"謝謝你教我。",exJP2:"手伝ってくれて ありがとう。",exZH2:"謝謝你幫忙。",q:"「来て＿＿ ありがとう。」填？",a:"くれて — 来てくれて。"},{title:"〜ないで〜します — 不…就…",formula:"ない形去ない + ないで + 動詞",cat:"動詞變化",yue:"唔做A就做B，或者唔做A嘅狀態下做B。",exJP:"辞書を 見ないで 答えました。",exZH:"沒看字典就回答了。",exJP2:"休まないで 働きます。",exZH2:"不休息就工作。",q:"「食べ＿＿ 行きます。」填？",a:"ないで — 食べないで。"},{title:"〜なくなりました — 沒有了 / 變得不…",formula:"い形容詞去い + くなくなります ／ な形容詞 + でなくなります",cat:"動詞變化",yue:"狀態改變：由有變無，或者由…變唔…。",exJP:"お金が なくなりました。",exZH:"沒有錢了。",exJP2:"雨が 降らなくなりました。",exZH2:"雨停了。",q:"「元気が なくな＿＿。」填？",a:"りました — なくなりました。"},{title:"〜にくい / やすい — 難… / 易…",formula:"ます形去ます + にくい / やすい",cat:"動詞變化",yue:"講難易：読みにくい＝難讀，読みやすい＝易讀。",exJP:"この本は 読みにくいです。",exZH:"這本書很難讀。",exJP2:"このペンは 書きやすいです。",exZH2:"這支筆很好寫。",q:"「この字は 書き＿＿です。」易寫填？",a:"やすい — 書きやすいです。"},{title:"〜たい / 〜たくない / 〜たがっています — 想 / 不想 / 他想",formula:"ます形去ます + たい / たくない ／ たがっています（第三人）",cat:"動詞變化",yue:"自己想用 たい，人哋想用 たがっています。",exJP:"日本へ 行きたいです。行きたくないです。",exZH:"想去日本。不想去。",exJP2:"弟は 映画を 見たがっています。",exZH2:"弟弟想看電影。",q:"「彼は 行き＿＿います。」第三人想去填？",a:"たがって — 行きたがっています。"},{title:"〜ことがあります — 有時會…",formula:"辞書形 + ことがあります",cat:"表達",yue:"講偶爾會發生，唔係經驗（たことがあります）。",exJP:"時々 頭が 痛いことが あります。",exZH:"有時會頭痛。",exJP2:"日曜日は 遅く 起きることが あります。",exZH2:"星期日有時會晚起。",q:"「時々 忘れる＿＿が あります。」填？",a:"こと — 忘れることが。"},{title:"〜ことになっています — 規定要…",formula:"辞書形 + ことになっています",cat:"表達",yue:"規則、約定：規定咗要咁做。",exJP:"9時に 始まることに なっています。",exZH:"規定9點開始。",exJP2:"ここで 写真を 撮らないことに なっています。",exZH2:"規定這裡不能拍照。",q:"「毎日 掃除する＿＿に なっています。」填？",a:"こと — することに。"},{title:"〜んです / 〜のです — 是因為…（解釋）",formula:"普通形 + んです / のです",cat:"表達",yue:"解釋原因、強調：因為…所以…。",exJP:"風邪を ひいたんです。だから 休みます。",exZH:"是因為感冒了。所以休息。",exJP2:"どうして 遅れたんですか。",exZH2:"為什麼遲到了？",q:"「疲れた＿＿。早く 寝ます。」填？",a:"んです — 疲れたんです。"},{title:"〜がする — 聞到 / 聽到 / 感覺到…",formula:"名詞 + がします",cat:"表達",yue:"講感覺：いいにおいがする＝聞到香味，音がする＝聽到聲音。",exJP:"いい においが します。",exZH:"聞到好香的味道。",exJP2:"外で 音が します。",exZH2:"外面有聲音。",q:"「変な 音＿＿ します。」填？",a:"が — 音がします。"},{title:"〜から〜まで — 從…到…（時間 / 地點）",formula:"開始 + から + 終點 + まで",yue:"時間同地點都用得，から係起點，まで係終點。",exJP:"9時から 5時まで 働きます。東京から 大阪まで 行きます。",exZH:"從九點工作到五點。從東京去到大阪。",q:"「9時＿＿ 5時＿＿ 働きます。」填？",a:"から、まで — 9時から5時まで。"},{title:"〜は〜で〜です — …係用…做嘅 / 喺…",formula:"主題 + は + 場所 / 手段 + で + です",yue:"用で講喺邊度、或者用咩方法。",exJP:"私は 図書館で 勉強します。",exZH:"我在圖書館學習。",q:"「学校＿＿ 勉強します。」填？",a:"で — 学校で。"},{title:"〜は〜に〜があります — …喺…有…",formula:"場所 + に + 物 + が + あります",yue:"無生命嘅嘢喺某個地方，用あります。",exJP:"机の上に 本が あります。",exZH:"桌子上有書。",q:"「部屋に 本＿＿ あります。」填？",a:"が — 本があります。"},{title:"〜は〜が〜です — …係…（雙重主語）",formula:"主題 + は + 主語 + が + 形容詞 / 名詞 + です",yue:"講主題入面嘅某一部分點樣，後面用が。",exJP:"私は 背が 高いです。弟は 頭が いいです。",exZH:"我身高很高。弟弟很聰明。",q:"「私は 目＿＿ 大きいです。」填？",a:"が — 目が大きいです。"},{title:"〜を〜に〜します — 把…變成… / 選…",formula:"受詞 + を + 結果 + に + します",yue:"做決定、改變狀態，都用にします。",exJP:"コーヒーにします。部屋を きれいにします。",exZH:"選咖啡。把房間弄乾淨。",q:"「私は お茶＿＿します。」填？",a:"に — お茶にします。"},{title:"〜を〜と〜います — 把…叫做…",formula:"名詞 + を + 名前 + と + 言います",yue:"講人哋點稱呼某樣嘢，用と言います。",exJP:"この 動物を 猫と 言います。",exZH:"這種動物叫做貓。",q:"「この 花を 桜＿＿ 言います。」填？",a:"と — 桜と言います。"},{title:"〜は〜と〜います — …同…比較（と比較）",formula:"A + と + B + と + どちらが + 形容詞ですか",yue:"問兩樣嘢比較，答：Aのほうが…です。",exJP:"夏と 冬と どちらが 暑いですか。",exZH:"夏天和冬天哪個更熱？",q:"「バス＿＿ 電車＿＿ どちらが 早いですか。」填？",a:"と、と — バスと電車と。"},{title:"〜は〜に〜しています — …喺…做緊…",formula:"主題 + は + 場所 + に + て形 + います",yue:"講緊喺邊度做緊咩，動作進行中。",exJP:"私は 図書館に いて、勉強しています。",exZH:"我在圖書館，正在學習。",q:"「公園＿＿ 遊んでいます。」填？",a:"で — 公園で遊んでいます。"},{title:"〜は〜を〜しています — …做緊…",formula:"主題 + は + 受詞 + を + て形 + います",yue:"進行式：而家做緊某件事。",exJP:"私は 本を 読んでいます。",exZH:"我正在看書。",q:"「今 ご飯＿＿ 食べています。」填？",a:"を — ご飯を食べています。"},{title:"〜は〜が〜できます — …能夠…",formula:"主題 + は + 辞書形 + ことが + できます",yue:"講能力，同可能形意思相近。",exJP:
